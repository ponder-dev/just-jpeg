name: Build and release

# Push a tag to cut a release:
#   npm version patch && git push --follow-tags
#
# Or run it by hand from the Actions tab to get installers without publishing.
on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-latest
            name: mac
            build: npm run dist:mac
          - os: ubuntu-latest
            name: linux
            build: npm run dist:linux
            # A CI runner has no display and no setuid sandbox helper, which
            # kills Electron at startup. xvfb provides the display and the
            # sandbox is off for this test process only, not for the build.
            selftest: xvfb-run --auto-servernum npx electron --no-sandbox test/selftest.cjs
          - os: windows-latest
            name: windows
            build: npm run dist:win

    runs-on: ${{ matrix.os }}

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install
        run: npm ci

      - name: Fetch the test images we do not redistribute
        run: node scripts/fetch-fixtures.mjs

      - name: Check where files are allowed to land
        run: node test/paths.test.mjs

      - name: Convert every fixture and check the output
        run: npm run bundle && ${{ matrix.selftest || 'npx electron test/selftest.cjs' }}

      - name: Build installers
        run: ${{ matrix.build }}

      - uses: actions/upload-artifact@v4
        with:
          name: justjpeg-${{ matrix.name }}
          path: |
            dist/*.dmg
            dist/*.exe
            dist/*.AppImage
            dist/*.tar.gz
          if-no-files-found: error

  release:
    needs: build
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: artifacts

      # A tag push rebuilds and republishes, and the publish step below replaces
      # assets of the same name. GitHub keeps the download counter on the asset,
      # so replacing them resets the count to zero with no way to restore it.
      # That happened once, when history was rewritten and the tags were force
      # pushed to follow. Refuse rather than quietly do it again.
      - name: Refuse to republish over an existing release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          tag="${GITHUB_REF_NAME}"
          count=$(gh release view "$tag" --repo "$GITHUB_REPOSITORY" \
                    --json assets --jq '.assets | length' 2>/dev/null || echo 0)
          if [ "${count:-0}" -gt 0 ]; then
            echo "::error::$tag already has $count assets. Rebuilding would replace them and reset the download counts. Delete the release first if that is genuinely what you want."
            exit 1
          fi
          echo "$tag has no assets yet, safe to publish."

      - name: Publish the installers
        uses: softprops/action-gh-release@v2
        with:
          files: artifacts/**/*
          draft: true
          generate_release_notes: true
          body: |
            Download the installer for your computer below.

            **Mac** Just JPEG-*-mac.dmg
            **Windows** Just JPEG-*-windows-setup.exe, or the portable build if
            you would rather not install anything.

            These builds are not code signed, so the first launch needs one
            extra step. On a Mac, right click the app and choose Open. On
            Windows, click "More info" then "Run anyway".
