name: Build and release

# Push a tag to cut a release:
#   npm version patch && git push --follow-tags
#
# Or run it by hand from the Actions tab to get installers without publishing.
#
# Publishing the drafted release then publishes the command line to npm, as
# @ponderdev/justjpeg, through npm trusted publishing: no token is stored
# anywhere. So each public step is its own act: the tag, then publishing the
# draft.
on:
  push:
    tags: ['v*']
  workflow_dispatch:
  release:
    types: [published]

permissions:
  contents: write

jobs:
  build:
    if: github.event_name != 'release'
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-latest
            name: mac
            build: npm run dist:mac
            # dist:mac already runs `npm run icon`; mac is the only platform with
            # iconutil, so the icns is built here or not at all.
            icon: npm run icon
          - os: ubuntu-latest
            name: linux
            build: npm run dist:linux
            # A CI runner has no display and no setuid sandbox helper, which
            # kills Electron at startup. xvfb provides the display and the
            # sandbox is off for this test process only, not for the build.
            selftest: xvfb-run --auto-servernum npx electron --no-sandbox test/selftest.cjs
            # Same two reasons: no display, no setuid sandbox. Linux packs
            # build/icon.png, so it needs the raster and not the icns.
            icon: npm run icon:svg && xvfb-run --auto-servernum npx electron --no-sandbox scripts/icons.cjs
          - os: windows-latest
            name: windows
            build: npm run dist:win
            # Windows packs build/icon.png, so it needs the raster and not the icns.
            icon: npm run icon:svg && npm run icon:raster

    runs-on: ${{ matrix.os }}

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install
        run: npm ci

      - name: Fetch the test images we do not redistribute
        run: node scripts/fetch-fixtures.mjs

      - name: Check where files are allowed to land
        run: node test/paths.test.mjs

      - name: Convert every fixture and check the output
        run: npm run bundle && ${{ matrix.selftest || 'npx electron test/selftest.cjs' }}

      - name: The command-line contract
        run: node test/contract.test.mjs

      # The command line end to end (reruns, --overwrite, TIFF, stdin), the pixel
      # turns, the credits page and the skill link: none of these ran before the
      # release, so what they guard shipped unchecked.
      - name: The command line, pixels, credits and skill link
        run: node test/show.test.mjs && node test/pixels.test.mjs && node test/tiff.test.mjs && node test/licences.test.mjs && node test/cli.test.mjs && node test/skill.test.cjs

      # The icon is generated from build/icon.svg on every platform, because the
      # svg is now the only icon artifact in git. Nothing downstream is hand
      # edited and nothing is committed that a build can produce. A failure here
      # stops the run rather than packaging with electron-builder's default icon,
      # which is the silent version of this failure and the one that ships.
      - name: Build the icon from its vector
        run: ${{ matrix.icon }}

      - name: Build installers
        run: ${{ matrix.build }}

      # A versioned filename breaks every download link on the website the
      # moment a new release goes out, quietly, on one file out of seven.
      - name: Refuse a filename carrying the version
        shell: bash
        run: |
          version=$(node -p "require('./package.json').version")
          bad=$(ls dist | grep -F "$version" || true)
          if [ -n "$bad" ]; then
            echo "::error::These artifacts carry the version in the filename: $bad"
            exit 1
          fi

      # What the command line says about itself, for the catalogue and the
      # site's specs page. Written once, from Linux, by the tool itself.
      - name: The describe file
        if: matrix.name == 'linux'
        run: node src/cli.mjs --describe > dist/justjpeg.json

      - uses: actions/upload-artifact@v4
        with:
          name: justjpeg-${{ matrix.name }}
          path: |
            dist/*.dmg
            dist/*.zip
            dist/*.exe
            dist/*.AppImage
            dist/*.tar.gz
            dist/justjpeg.json
          if-no-files-found: error

  release:
    needs: build
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: artifacts

      # A tag push rebuilds and republishes, and the publish step below replaces
      # assets of the same name. GitHub keeps the download counter on the asset,
      # so replacing them resets the count to zero with no way to restore it.
      # That happened once, when history was rewritten and the tags were force
      # pushed to follow. Refuse rather than quietly do it again.
      - name: Refuse to republish over an existing release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          tag="${GITHUB_REF_NAME}"
          count=$(gh release view "$tag" --repo "$GITHUB_REPOSITORY" \
                    --json assets --jq '.assets | length' 2>/dev/null || echo 0)
          if [ "${count:-0}" -gt 0 ]; then
            echo "::error::$tag already has $count assets. Rebuilding would replace them and reset the download counts. Delete the release first if that is genuinely what you want."
            exit 1
          fi
          echo "$tag has no assets yet, safe to publish."

      - name: Publish the installers
        uses: softprops/action-gh-release@v2
        with:
          files: artifacts/**/*
          draft: true
          generate_release_notes: true
          body: |
            Download the installer for your computer below.

            **Mac** JustJPEG-mac.dmg, one download for both chips.
            **Windows** JustJPEG-windows-setup.exe, or the portable build if
            you would rather not install anything.
            **Linux** JustJPEG-linux-x86_64.AppImage, or the tar.gz.
            **Command line** `npm install -g @ponderdev/justjpeg`

            The .zip files are for Just Tool Belt, which installs from them.

            These builds are not code signed, so the first launch needs one
            extra step. On a Mac, right click the app and choose Open. On
            Windows, click "More info" then "Run anyway".

  # npm, only when a person publishes the drafted release. Trusted
  # publishing: GitHub proves to npm which workflow built the package, so no
  # token exists to leak. npmjs.com has to name this repo and this file
  # (release.yml) as the package's trusted publisher first.
  npm:
    name: Publish the command line to npm
    if: github.event_name == 'release'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          registry-url: https://registry.npmjs.org

      # Trusted publishing needs a newer npm than Node 22 ships with.
      - name: A current npm
        run: npm install -g npm@latest

      # Its one postinstall stays: it links the tool's Claude skill on a global
      # install (scripts/link-skill.cjs). No skill, no release.
      - name: Shape the package for npm
        run: |
          npm pkg set name=@ponderdev/justjpeg
          npm pkg delete private devDependencies
          test "$(npm pkg get scripts.postinstall)" = '"node scripts/link-skill.cjs"'
          node src/cli.mjs --version
          npm pack --dry-run 2>&1 | tee pack.txt
          grep -q 'agents/skills/justjpeg/SKILL.md' pack.txt

      # Trusted publishing (OIDC, id-token: write above): no token anywhere. A
      # token in the environment would win over OIDC and fail, so there is none.
      # Provenance comes with it.
      - name: Publish
        run: npm publish --access public

