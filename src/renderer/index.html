<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta http-equiv="Content-Security-Policy"
        content="default-src 'none'; script-src 'self'; style-src 'self'; img-src 'self' data: blob:; worker-src 'self' blob:; connect-src 'self' blob: data:;" />
  <title>Just JPEG</title>
  <link rel="stylesheet" href="kit/kit.css" />
</head>
<body>
  <div class="titlebar"></div>

  <main id="app">
    <div class="k-utility">
      <!-- The start screen and, once photos are in, the file row (Kit.start) -->
      <div id="start"></div>

      <!-- Everything below comes in once photos are in -->
      <div class="after-file">
        <section class="k-section">
          <div class="k-field">
            <div class="k-label" id="label-format">Convert to</div>
            <div id="seg-format" aria-labelledby="label-format"></div>
            <p class="hint" id="hint-format">Best for photos. Keeps date, camera and location.</p>
          </div>

          <div class="k-field" id="field-quality">
            <label for="quality">Quality <span id="quality-value" class="pill">85</span></label>
            <input type="range" id="quality" min="40" max="100" value="85" />
            <p class="hint">Higher keeps more detail and makes bigger files.</p>
          </div>

          <div class="k-field">
            <label for="size">Size</label>
            <select id="size">
              <option value="0">Keep original size</option>
              <option value="4000">Large, 4000px long edge</option>
              <option value="2000">Medium, 2000px long edge</option>
              <option value="1200">Small, 1200px long edge</option>
            </select>
            <p class="hint">Shrinking makes files much smaller for email and the web.</p>
          </div>

          <div class="k-field">
            <div class="k-label">Save to</div>
            <div class="k-dest">
              <button type="button" id="btn-output" class="btn btn-ghost">Choose folder</button>
              <span id="output-label" class="k-dest-path">Next to each original</span>
              <button type="button" id="btn-output-clear" class="linky" hidden>Back to the default</button>
            </div>
            <!-- Only with a folder in; kept through Kit.store. A chosen folder wins. -->
            <div id="where-field" hidden>
              <label class="k-check"><input type="checkbox" id="beside"> <span>Save next to the originals instead</span></label>
              <p class="hint" id="where-hint"></p>
            </div>
          </div>

          <div class="k-field">
            <label for="existing">If a file already exists</label>
            <select id="existing">
              <option value="skip">Skip it</option>
              <option value="rename">Keep both</option>
              <option value="overwrite">Replace it (only files Just JPEG made)</option>
            </select>
          </div>

          <div class="k-field">
            <label class="k-check" id="keep-metadata-label">
              <input type="checkbox" id="keep-metadata" checked />
              <span>Keep photo details (date, camera, location)</span>
            </label>
            <label class="k-check">
              <input type="checkbox" id="keep-date" checked />
              <span>Keep the original file date</span>
            </label>
            <label class="k-check">
              <input type="checkbox" id="max-quality" />
              <span>Highest quality, full colour detail <span class="muted">(slower, bigger files)</span></span>
            </label>
          </div>
        </section>

        <!-- The estimate above the main button; what happens once it is pressed, under it (Kit.run) -->
        <p class="k-note" id="plan-note"></p>
        <button type="button" id="btn-convert" class="btn btn-primary btn-wide k-action">Convert</button>
        <div id="run"></div>
      </div>
    </div>
  </main>

  <footer id="footer"></footer>

  <script src="kit/kit.js"></script>
  <script type="module" src="app.js"></script>
</body>
</html>
